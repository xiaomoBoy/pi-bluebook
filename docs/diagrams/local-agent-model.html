<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地 Agent 不等于本地模型</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#fbfaf6;--ink:#26313a;--muted:#65727d;--soft:#87939b;--accent:#4f90aa;--link:#276d89;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;--serif:"Iowan Old Style",Baskerville,"Songti SC",STSong,serif;--mono:"SFMono-Regular",Consolas,Menlo,monospace}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--paper);color:var(--ink);font-family:var(--sans)}
    .frame{width:min(100%,960px)}.eyebrow{margin-bottom:8px;color:var(--link);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.14em}h1{margin-bottom:20px;font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:600;line-height:1.2;letter-spacing:-.02em}svg{display:block;width:100%;min-width:720px}
  </style>
</head>
<body><main class="frame">
  <p class="eyebrow">PI BLUEBOOK · ARCHITECTURE</p>
  <h1>本地 Agent 不等于本地模型</h1>
  <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="local-agent-model-title local-agent-model-desc">
    <title id="local-agent-model-title">本地 Agent 不等于本地模型</title>
    <desc id="local-agent-model-desc">Pi 可以在本地运行并连接云端模型，也可以通过本地路由连接在自己硬件上运行的模型，Agent 位置和推理位置需要分别判断。</desc>

      <marker id="local-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#65727d"/></marker>
      <marker id="local-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f90aa"/></marker>
      <marker id="local-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#276d89"/></marker>
    </defs>
    <rect width="960" height="600" fill="#fbfaf6"/>
    <rect x="40" y="104" width="880" height="168" rx="8" fill="#26313a" fill-opacity="0.02" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/>
    <rect x="56" y="108" width="128" height="16" rx="2" fill="#fbfaf6"/>

    <rect x="40" y="316" width="880" height="168" rx="8" fill="#26313a" fill-opacity="0.02" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/>
    <rect x="56" y="320" width="128" height="16" rx="2" fill="#fbfaf6"/>
    <text x="120" y="332" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle" letter-spacing="0.10em">LOCAL MODEL</text>
    <line x1="280" y1="200" x2="380" y2="200" stroke="#276d89" stroke-width="1.2" marker-end="url(#local-arrow-link)"/>
    <line x1="580" y1="200" x2="680" y2="200" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#local-arrow-accent)"/>
    <line x1="280" y1="412" x2="380" y2="412" stroke="#276d89" stroke-width="1.2" marker-end="url(#local-arrow-link)"/>
    <line x1="580" y1="412" x2="680" y2="412" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#local-arrow-accent)"/>
    <rect x="296" y="180" width="68" height="12" rx="2" fill="#fbfaf6"/><text x="330" y="189" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">NETWORK</text>
    <rect x="596" y="180" width="68" height="12" rx="2" fill="#fbfaf6"/><text x="630" y="189" fill="#4f90aa" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">INFERENCE</text>
    <rect x="296" y="392" width="68" height="12" rx="2" fill="#fbfaf6"/><text x="330" y="401" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">LOCAL API</text>
    <rect x="596" y="392" width="68" height="12" rx="2" fill="#fbfaf6"/><text x="630" y="401" fill="#4f90aa" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">INFERENCE</text>

    <rect x="92" y="168" width="48" height="12" rx="2" fill="none" stroke="#4f90aa" stroke-opacity="0.55" stroke-width="0.8"/><text x="116" y="177" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">LOCAL</text>
    <text x="180" y="204" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Pi Agent</text><text x="180" y="224" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">运行在你的电脑或 VPS</text>
    <rect x="380" y="156" width="200" height="88" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/><rect x="392" y="168" width="64" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="424" y="177" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">PROVIDER</text><text x="480" y="204" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">云端服务</text><text x="480" y="224" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">认证 · 路由 · 计费</text>
    <rect x="680" y="156" width="200" height="88" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/><rect x="692" y="168" width="48" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="716" y="177" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">MODEL</text><text x="780" y="204" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">云端模型</text><text x="780" y="224" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">推理发生在服务商侧</text>
    <rect x="80" y="368" width="200" height="88" rx="8" fill="#fbfaf6"/><rect x="80" y="368" width="200" height="88" rx="8" fill="#4f90aa" fill-opacity="0.10" stroke="#4f90aa" stroke-width="1.2"/><rect x="92" y="380" width="48" height="12" rx="2" fill="none" stroke="#4f90aa" stroke-opacity="0.55" stroke-width="0.8"/><text x="116" y="389" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">LOCAL</text><text x="180" y="416" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Pi Agent</text><text x="180" y="436" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">仍然运行在本地</text>
    <rect x="380" y="368" width="200" height="88" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/><rect x="392" y="380" width="56" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="420" y="389" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">ROUTER</text><text x="480" y="416" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">本地模型接口</text><text x="480" y="436" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">例如 llama.cpp</text>
    <rect x="680" y="368" width="200" height="88" rx="6" fill="#26313a" fill-opacity="0.05" stroke="#65727d" stroke-width="1"/><rect x="692" y="380" width="48" height="12" rx="2" fill="none" stroke="#65727d" stroke-opacity="0.45" stroke-width="0.8"/><text x="716" y="389" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">MODEL</text><text x="780" y="416" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">本地模型</text><text x="780" y="436" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">推理在自有硬件完成</text>
    <line x1="40" y1="524" x2="920" y2="524" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/><text x="40" y="548" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" letter-spacing="0.14em">KEY</text><text x="112" y="548" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif">Agent 在哪里运行，和模型在哪里推理，是两件事。</text>
  </svg>
</main></body></html>
