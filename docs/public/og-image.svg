  <text x="96" y="362" fill="#26313a" font-family="Iowan Old Style, Songti SC, STSong, serif" font-size="27" font-weight="600">从第一次可验收的任务开始，走向可控的 Agent 工作流。</text>

  <rect x="96" y="423" width="116" height="38" fill="#276d89"/>
  <text x="154" y="448" fill="#fbfaf6" font-family="SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">场景</text>
  <text x="230" y="449" fill="#65727d" font-family="SFMono-Regular, Menlo, monospace" font-size="17">→ 概念 → 实操 → 验收</text>
  <text x="96" y="538" fill="#65727d" font-family="SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2">pi.xiaomovps.com</text>

  <text x="848" y="206" fill="#f8f5ed" font-family="Iowan Old Style, Baskerville, serif" font-size="142">P</text>
