  <text x="848" y="280" fill="#a9b0b5" font-family="SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3">CURRENT EDITION</text>
  <line x1="848" y1="310" x2="1100" y2="310" stroke="#65727d" stroke-opacity=".6"/>
  <text x="848" y="354" fill="#a9b0b5" font-family="SFMono-Regular, Menlo, monospace" font-size="15">主线课程</text>
  <text x="1100" y="354" fill="#f8f5ed" font-family="SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="end">14 课</text>
  <line x1="848" y1="374" x2="1100" y2="374" stroke="#65727d" stroke-opacity=".45"/>
  <text x="848" y="418" fill="#a9b0b5" font-family="SFMono-Regular, Menlo, monospace" font-size="15">学习模块</text>
  <text x="1100" y="418" fill="#f8f5ed" font-family="SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="end">5 个</text>
  <line x1="848" y1="438" x2="1100" y2="438" stroke="#65727d" stroke-opacity=".45"/>
  <text x="848" y="482" fill="#a9b0b5" font-family="SFMono-Regular, Menlo, monospace" font-size="15">学习档案</text>
  <text x="1100" y="482" fill="#f8f5ed" font-family="SFMono-Regular, Menlo, monospace" font-size="17" text-anchor="end">98 篇</text>
