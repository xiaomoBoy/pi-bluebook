<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="project-trust-title project-trust-desc">
  <title id="project-trust-title">Project Trust 不是沙箱</title>
  <desc id="project-trust-desc">Project Trust 决定是否加载项目级设置、Skill 和 Extension，加载后的 Pi 与工具仍在操作系统账户、容器或虚拟机提供的权限边界内运行。</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="trust-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#65727d"/></marker><marker id="trust-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f90aa"/></marker><marker id="trust-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#276d89"/></marker></defs>
  <rect width="960" height="600" fill="#fbfaf6"/>
  <rect x="40" y="120" width="240" height="360" rx="8" fill="#26313a" fill-opacity="0.02" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/><rect x="56" y="124" width="120" height="16" rx="2" fill="#fbfaf6"/><text x="116" y="136" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle" letter-spacing="0.10em">PROJECT FOLDER</text>
  <rect x="500" y="120" width="420" height="360" rx="8" fill="#4f90aa" fill-opacity="0.04" stroke="#4f90aa" stroke-opacity="0.45" stroke-width="0.8" stroke-dasharray="4,4"/><rect x="516" y="124" width="168" height="16" rx="2" fill="#fbfaf6"/><text x="600" y="136" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle" letter-spacing="0.10em">OS / CONTAINER / VM</text>
  <line x1="280" y1="284" x2="336" y2="284" stroke="#65727d" stroke-width="1.2" marker-end="url(#trust-arrow)"/><line x1="464" y1="284" x2="560" y2="284" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#trust-arrow-accent)"/>
  <path d="M688 244 H784 Q792 244 792 236 V216" fill="none" stroke="#65727d" stroke-width="1.2" marker-end="url(#trust-arrow)"/><path d="M688 324 H784 Q792 324 792 332 V352" fill="none" stroke="#65727d" stroke-width="1.2" marker-end="url(#trust-arrow)"/>
  <rect x="288" y="264" width="40" height="12" rx="2" fill="#fbfaf6"/><text x="308" y="273" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">ASK</text><rect x="480" y="264" width="64" height="12" rx="2" fill="#fbfaf6"/><text x="512" y="273" fill="#4f90aa" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">LOAD YES</text><rect x="712" y="224" width="64" height="12" rx="2" fill="#fbfaf6"/><text x="744" y="233" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">READ / EDIT</text><rect x="712" y="336" width="64" height="12" rx="2" fill="#fbfaf6"/><text x="744" y="345" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">EXECUTE</text>
