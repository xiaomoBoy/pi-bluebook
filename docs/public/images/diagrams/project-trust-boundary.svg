  <rect x="336" y="220" width="128" height="128" rx="8" fill="#fbfaf6"/><rect x="336" y="220" width="128" height="128" rx="8" fill="#4f90aa" fill-opacity="0.10" stroke="#4f90aa" stroke-width="1.2"/><rect x="348" y="232" width="48" height="16" rx="2" fill="none" stroke="#4f90aa" stroke-opacity="0.55" stroke-width="0.8"/><text x="372" y="244" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">TRUST</text><text x="400" y="284" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">加载闸门</text><text x="400" y="308" fill="#276d89" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">信任 / 不信任</text><text x="400" y="332" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">只决定项目资源</text>
  <rect x="560" y="220" width="128" height="128" rx="8" fill="#fbfaf6"/><rect x="560" y="220" width="128" height="128" rx="8" fill="#4f90aa" fill-opacity="0.10" stroke="#4f90aa" stroke-width="1.2"/><rect x="572" y="232" width="64" height="16" rx="2" fill="none" stroke="#4f90aa" stroke-opacity="0.55" stroke-width="0.8"/><text x="604" y="244" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">RUNTIME</text><text x="624" y="284" fill="#26313a" font-size="24" font-weight="600" font-family="Iowan Old Style,Songti SC,serif" text-anchor="middle">Pi</text><text x="624" y="308" fill="#276d89" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">当前用户权限</text><text x="624" y="332" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">工具与扩展在此运行</text>
  <rect x="792" y="160" width="104" height="88" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/><rect x="804" y="172" width="48" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="828" y="181" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">FILES</text><text x="844" y="212" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">文件</text><text x="844" y="232" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">读写范围</text>
  <rect x="792" y="352" width="104" height="88" rx="6" fill="#26313a" fill-opacity="0.05" stroke="#65727d" stroke-width="1"/><rect x="804" y="364" width="56" height="12" rx="2" fill="none" stroke="#65727d" stroke-opacity="0.45" stroke-width="0.8"/><text x="832" y="373" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">SYSTEM</text><text x="844" y="404" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">命令与网络</text><text x="844" y="424" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">由环境限制</text>
  <line x1="40" y1="524" x2="920" y2="524" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/><text x="40" y="548" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" letter-spacing="0.14em">KEY</text><text x="112" y="548" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif">Trust 管“是否加载”；账户、容器或虚拟机才管“能做什么”。</text>
</svg>
