<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="context-session-title context-session-desc">
    <title id="context-session-title">Session、Context 与 Compaction</title>
    <desc id="context-session-desc">Session 保存完整会话树，Pi 从选中路径、项目文件和压缩摘要组装当前 Context，再把本轮输入发送给模型。</desc>
    <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="context-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#65727d"/></marker><marker id="context-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f90aa"/></marker><marker id="context-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#276d89"/></marker></defs>
    <rect width="960" height="600" fill="#fbfaf6"/>
    <line x1="200" y1="268" x2="280" y2="268" stroke="#65727d" stroke-width="1.2" marker-end="url(#context-arrow)"/>
    <line x1="480" y1="268" x2="560" y2="268" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#context-arrow-accent)"/>
    <line x1="720" y1="268" x2="760" y2="268" stroke="#276d89" stroke-width="1.2" marker-end="url(#context-arrow-link)"/>
    <path d="M120 384 V356 Q120 348 128 348 H372 Q380 348 380 340 V324" fill="none" stroke="#65727d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#context-arrow)"/>
    <line x1="440" y1="384" x2="440" y2="324" stroke="#65727d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#context-arrow)"/>
    <rect x="204" y="248" width="72" height="12" rx="2" fill="#fbfaf6"/><text x="240" y="257" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">SELECT PATH</text>
    <rect x="484" y="248" width="72" height="12" rx="2" fill="#fbfaf6"/><text x="520" y="257" fill="#4f90aa" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">ASSEMBLE</text>
    <rect x="724" y="248" width="32" height="12" rx="2" fill="#fbfaf6"/><text x="740" y="257" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">SEND</text>
    <rect x="184" y="328" width="72" height="12" rx="2" fill="#fbfaf6"/><text x="220" y="337" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">READ WHEN NEEDED</text>
    <rect x="452" y="340" width="64" height="12" rx="2" fill="#fbfaf6"/><text x="484" y="349" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">SUMMARY</text>
    <rect x="40" y="220" width="160" height="96" rx="6" fill="#26313a" fill-opacity="0.05" stroke="#65727d" stroke-width="1"/><rect x="52" y="232" width="48" height="12" rx="2" fill="none" stroke="#65727d" stroke-opacity="0.45" stroke-width="0.8"/><text x="76" y="241" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">STATE</text><text x="120" y="268" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">Session Tree</text><text x="120" y="292" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">完整历史与分支</text>
    <rect x="280" y="204" width="200" height="120" rx="8" fill="#fbfaf6"/><rect x="280" y="204" width="200" height="120" rx="8" fill="#4f90aa" fill-opacity="0.10" stroke="#4f90aa" stroke-width="1.2"/><rect x="292" y="216" width="64" height="16" rx="2" fill="none" stroke="#4f90aa" stroke-opacity="0.55" stroke-width="0.8"/><text x="324" y="228" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">HARNESS</text><text x="380" y="268" fill="#26313a" font-size="24" font-weight="600" font-family="Iowan Old Style,Songti SC,serif" text-anchor="middle">Pi</text><text x="380" y="292" fill="#276d89" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">组装本轮上下文</text><text x="380" y="312" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">只发送当前有效材料</text>
    <rect x="560" y="220" width="160" height="96" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/><rect x="572" y="232" width="64" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="604" y="241" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">CONTEXT</text><text x="640" y="268" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">当前 Context</text><text x="640" y="292" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">受窗口容量限制</text>
    <rect x="760" y="228" width="160" height="80" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/><rect x="772" y="240" width="48" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="796" y="249" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">MODEL</text><text x="840" y="276" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">模型</text><text x="840" y="296" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">只看到本轮输入</text>
    <rect x="40" y="384" width="160" height="88" rx="6" fill="#26313a" fill-opacity="0.05" stroke="#65727d" stroke-width="1"/><rect x="52" y="396" width="48" height="12" rx="2" fill="none" stroke="#65727d" stroke-opacity="0.45" stroke-width="0.8"/><text x="76" y="405" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">FILES</text><text x="120" y="432" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">项目文件</text><text x="120" y="452" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">需要时重新读取</text>
    <rect x="280" y="384" width="200" height="88" rx="6" fill="#26313a" fill-opacity="0.05" stroke="#65727d" stroke-width="1" stroke-dasharray="4,3"/><rect x="292" y="396" width="88" height="12" rx="2" fill="none" stroke="#65727d" stroke-opacity="0.45" stroke-width="0.8"/><text x="336" y="405" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">COMPACTION</text><text x="380" y="432" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">压缩摘要</text><text x="380" y="452" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">替代部分较早原文</text>
    <line x1="40" y1="524" x2="920" y2="524" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/><text x="40" y="548" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" letter-spacing="0.14em">KEY</text><text x="112" y="548" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif">历史保存在 Session；模型此刻能看到的是 Context。</text>
  </svg>
