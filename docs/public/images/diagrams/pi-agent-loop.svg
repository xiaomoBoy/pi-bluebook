<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pi-agent-loop-title pi-agent-loop-desc">
      <title id="pi-agent-loop-title">Pi 从一条 Prompt 到一次完整 Agent Loop</title>
      <desc id="pi-agent-loop-desc">Pi 从当前 Session 组装 Context 并调用模型；模型可以反复调用工具并读取结果，最后回复用户并把过程写回 Session；上下文过长时才进入 Compaction。</desc>
      <defs><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap");</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#65727d"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f90aa"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#276d89"/></marker>
      </defs>

      <rect width="960" height="600" fill="#fbfaf6"/>

      <!-- Connectors: draw before nodes. -->
      <line x1="176" y1="224" x2="224" y2="224" stroke="#276d89" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="464" y1="224" x2="528" y2="224" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="704" y1="224" x2="784" y2="224" stroke="#65727d" stroke-width="1.2" marker-end="url(#arrow)"/>

      <line x1="576" y1="272" x2="576" y2="352" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="656" y1="352" x2="656" y2="272" stroke="#65727d" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 852,260 V 480 Q 852,488 844,488 H 408 Q 400,488 400,480 V 464" fill="none" stroke="#65727d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="384" y1="352" x2="384" y2="288" stroke="#65727d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="224" y1="400" x2="176" y2="400" stroke="#65727d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 40,384 H 32 Q 24,384 24,376 V 120 Q 24,112 32,112 H 296 Q 304,112 304,120 V 160" fill="none" stroke="#65727d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Connector labels: opaque masks with visible spacing. -->
      <rect x="180" y="196" width="40" height="12" rx="2" fill="#fbfaf6"/>
      <text x="200" y="204" fill="#276d89" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>

      <rect x="472" y="196" width="48" height="12" rx="2" fill="#fbfaf6"/>
      <text x="496" y="204" fill="#4f90aa" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">ASSEMBLE</text>

      <rect x="716" y="196" width="56" height="12" rx="2" fill="#fbfaf6"/>
      <text x="744" y="204" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">RESPOND</text>

      <rect x="516" y="304" width="52" height="16" rx="2" fill="#fbfaf6"/>
      <text x="544" y="316" fill="#4f90aa" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL CALL</text>

      <rect x="664" y="304" width="56" height="16" rx="2" fill="#fbfaf6"/>
      <text x="692" y="316" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL RESULT</text>

      <rect x="592" y="468" width="56" height="12" rx="2" fill="#fbfaf6"/>
      <text x="620" y="476" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE BACK</text>

      <rect x="392" y="308" width="56" height="12" rx="2" fill="#fbfaf6"/>
      <text x="420" y="316" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">REBUILD</text>

      <rect x="180" y="380" width="40" height="12" rx="2" fill="#fbfaf6"/>
      <text x="200" y="388" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">WHEN FULL</text>

      <rect x="120" y="88" width="112" height="12" rx="2" fill="#fbfaf6"/>
      <text x="176" y="96" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">SUMMARY + RECENT</text>

      <!-- Input -->
      <rect x="40" y="188" width="136" height="72" rx="6" fill="#fbfaf6"/>
      <rect x="40" y="188" width="136" height="72" rx="6" fill="#65727d" fill-opacity="0.10" stroke="#87939b" stroke-width="1"/>
      <rect x="48" y="196" width="40" height="12" rx="2" fill="none" stroke="#65727d" stroke-opacity="0.42" stroke-width="0.8"/>
      <text x="68" y="204" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle">INPUT</text>
      <text x="108" y="228" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">用户任务</text>
      <text x="108" y="248" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">目标与限制</text>

      <!-- Context focal node -->
      <rect x="224" y="160" width="240" height="128" rx="8" fill="#fbfaf6"/>
      <rect x="224" y="160" width="240" height="128" rx="8" fill="#4f90aa" fill-opacity="0.10" stroke="#4f90aa" stroke-width="1.2"/>
      <rect x="236" y="172" width="64" height="16" rx="2" fill="none" stroke="#4f90aa" stroke-opacity="0.55" stroke-width="0.8"/>
      <text x="268" y="184" fill="#276d89" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">CONTEXT</text>
      <text x="344" y="212" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">组装本轮模型输入</text>
      <text x="344" y="236" fill="#276d89" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">System Prompt · 项目规则</text>
      <text x="344" y="256" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">Tool 定义 · Skill 索引</text>
      <text x="344" y="276" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">活动分支 · 当前输入</text>

      <!-- Model -->
      <rect x="528" y="176" width="176" height="96" rx="6" fill="#fbfaf6"/>
      <rect x="528" y="176" width="176" height="96" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/>
      <rect x="536" y="184" width="40" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/>
      <text x="556" y="192" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle">MODEL</text>
      <text x="616" y="224" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">模型推理</text>
      <text x="616" y="248" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">回答，或选择工具</text>

      <!-- Final response -->
      <rect x="784" y="188" width="136" height="72" rx="6" fill="#fbfaf6"/>
      <rect x="784" y="188" width="136" height="72" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/>
      <rect x="792" y="196" width="40" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/>
      <text x="812" y="204" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle">OUTPUT</text>
      <text x="852" y="228" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">最终回复</text>
      <text x="852" y="248" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">本轮结束</text>

      <!-- Tools -->
      <rect x="528" y="352" width="176" height="96" rx="6" fill="#fbfaf6"/>
      <rect x="528" y="352" width="176" height="96" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/>
      <rect x="536" y="360" width="40" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/>
      <text x="556" y="368" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle">TOOLS</text>
      <text x="616" y="400" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">真实环境</text>
      <text x="616" y="424" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">读取 · 写入 · 命令</text>

      <!-- Session -->
      <rect x="224" y="352" width="240" height="112" rx="6" fill="#fbfaf6"/>
      <rect x="224" y="352" width="240" height="112" rx="6" fill="#26313a" fill-opacity="0.05" stroke="#65727d" stroke-width="1"/>
      <rect x="232" y="360" width="40" height="12" rx="2" fill="none" stroke="#65727d" stroke-opacity="0.45" stroke-width="0.8"/>
      <text x="252" y="368" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle">STATE</text>
      <text x="344" y="400" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">Session · 活动分支</text>
      <text x="344" y="424" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">用户 · 模型 · 工具事件</text>
      <text x="344" y="444" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">持续保存，供下一轮重建</text>

      <!-- Compaction -->
      <rect x="40" y="352" width="136" height="96" rx="6" fill="#fbfaf6"/>
      <rect x="40" y="352" width="136" height="96" rx="6" fill="#26313a" fill-opacity="0.02" stroke="#26313a" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="48" y="360" width="56" height="12" rx="2" fill="none" stroke="#65727d" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="76" y="368" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle">OPTIONAL</text>
      <text x="108" y="400" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">Compaction</text>
      <text x="108" y="424" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">较早内容变摘要</text>

      <!-- Bottom legend strip -->
      <line x1="40" y1="520" x2="920" y2="520" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="40" y="544" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="128" y="532" width="16" height="12" rx="2" fill="#4f90aa" fill-opacity="0.10" stroke="#4f90aa" stroke-width="1"/>
      <text x="152" y="544" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif">本轮 Context</text>

      <rect x="288" y="532" width="16" height="12" rx="2" fill="#ffffff" stroke="#26313a" stroke-width="1"/>
      <text x="312" y="544" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif">执行与输出</text>

      <rect x="448" y="532" width="16" height="12" rx="2" fill="#26313a" fill-opacity="0.05" stroke="#65727d" stroke-width="1"/>
      <text x="472" y="544" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif">持久历史</text>

      <line x1="592" y1="540" x2="624" y2="540" stroke="#65727d" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="636" y="544" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif">条件路径</text>

      <text x="920" y="580" fill="#65727d" font-size="12" font-family="Iowan Old Style, Songti SC, serif" font-style="italic" text-anchor="end">工具结果不是终点，而是下一次模型判断的证据。</text>
    </svg>
