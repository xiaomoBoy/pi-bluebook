<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skill-extension-title skill-extension-desc">
  <title id="skill-extension-title">Skill、Extension 和 Package 怎么选</title>
  <desc id="skill-extension-desc">先确认真实需求，只缺方法时使用 Skill，缺少运行能力时考虑 Extension，需要跨项目或给别人复用时再用 Package 分发。</desc>
  <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style><marker id="choice-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#65727d"/></marker><marker id="choice-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f90aa"/></marker><marker id="choice-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#276d89"/></marker></defs>
  <rect width="960" height="600" fill="#fbfaf6"/>
  <line x1="480" y1="96" x2="480" y2="132" stroke="#65727d" stroke-width="1.2" marker-end="url(#choice-arrow)"/>
  <path d="M360 196 H208 Q200 196 200 204 V280" fill="none" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#choice-arrow-accent)"/>
  <path d="M600 196 H752 Q760 196 760 204 V280" fill="none" stroke="#276d89" stroke-width="1.2" marker-end="url(#choice-arrow-link)"/>
  <path d="M200 368 V448 Q200 456 208 456 H360" fill="none" stroke="#65727d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#choice-arrow)"/>
  <path d="M760 368 V448 Q760 456 752 456 H600" fill="none" stroke="#65727d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#choice-arrow)"/>
  <rect x="232" y="176" width="104" height="12" rx="2" fill="#fbfaf6"/><text x="284" y="185" fill="#4f90aa" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">METHOD / KNOWLEDGE</text>
  <rect x="624" y="176" width="104" height="12" rx="2" fill="#fbfaf6"/><text x="676" y="185" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">RUNTIME CAPABILITY</text>
  <rect x="220" y="424" width="112" height="12" rx="2" fill="#fbfaf6"/><text x="276" y="433" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">SHARE WHEN NEEDED</text>
  <rect x="628" y="424" width="112" height="12" rx="2" fill="#fbfaf6"/><text x="684" y="433" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">SHARE WHEN NEEDED</text>
  <rect x="380" y="40" width="200" height="56" rx="28" fill="#26313a" fill-opacity="0.05" stroke="#65727d" stroke-width="1"/><text x="480" y="72" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">先确认真实需求</text>
  <polygon points="480,132 600,196 480,260 360,196" fill="#4f90aa" fill-opacity="0.10" stroke="#4f90aa" stroke-width="1.2"/><text x="480" y="188" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">缺少的是方法</text><text x="480" y="212" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">还是运行能力？</text>
  <rect x="80" y="280" width="240" height="88" rx="8" fill="#fbfaf6"/><rect x="80" y="280" width="240" height="88" rx="8" fill="#4f90aa" fill-opacity="0.10" stroke="#4f90aa" stroke-width="1.2"/><rect x="92" y="292" width="48" height="12" rx="2" fill="none" stroke="#4f90aa" stroke-opacity="0.55" stroke-width="0.8"/><text x="116" y="301" fill="#276d89" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">SKILL</text><text x="200" y="328" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">教 Agent 怎么做</text><text x="200" y="348" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">说明 · 脚本 · 参考资料</text>
  <rect x="640" y="280" width="240" height="88" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/><rect x="652" y="292" width="72" height="12" rx="2" fill="none" stroke="#26313a" stroke-opacity="0.38" stroke-width="0.8"/><text x="688" y="301" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">EXTENSION</text><text x="760" y="328" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">增加运行能力</text><text x="760" y="348" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">工具 · 命令 · 事件处理</text>
  <rect x="360" y="416" width="240" height="80" rx="6" fill="#26313a" fill-opacity="0.05" stroke="#65727d" stroke-width="1"/><rect x="372" y="428" width="64" height="12" rx="2" fill="none" stroke="#65727d" stroke-opacity="0.45" stroke-width="0.8"/><text x="404" y="437" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" text-anchor="middle">PACKAGE</text><text x="480" y="464" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">打包并分发资源</text><text x="480" y="484" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle">可包含 Skill、Extension 等</text>
  <line x1="40" y1="524" x2="920" y2="524" stroke="#26313a" stroke-opacity="0.12" stroke-width="0.8"/><text x="40" y="548" fill="#65727d" font-size="8" font-family="SFMono-Regular,Consolas,monospace" letter-spacing="0.14em">KEY</text><text x="112" y="548" fill="#65727d" font-size="12" font-family="PingFang SC,Microsoft YaHei,sans-serif">三者不是能力等级；先解决需求，再考虑分发。</text>
</svg>
