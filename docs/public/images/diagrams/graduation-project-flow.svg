<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="capstone-title capstone-desc">
      <title id="capstone-title">CASE 08 毕业项目三方验收工作流</title>
      <desc id="capstone-desc">学习者给出需求并批准计划，Pi 主 Session 查项目、实施并测试，独立审阅 Session 只读复核，主 Session 只做必要修正，最后由学习者人工验收。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#65727d"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f90aa"/></marker>
      </defs>

      <rect width="960" height="600" fill="#fbfaf6"/>

      <!-- Actor lanes -->
      <rect x="40" y="48" width="240" height="432" rx="8" fill="rgba(38,49,58,0.025)" stroke="rgba(38,49,58,0.14)" stroke-width="1"/>
      <rect x="320" y="48" width="320" height="432" rx="8" fill="rgba(79,144,170,0.045)" stroke="rgba(79,144,170,0.24)" stroke-width="1"/>
      <rect x="680" y="48" width="240" height="432" rx="8" fill="rgba(38,49,58,0.025)" stroke="rgba(38,49,58,0.14)" stroke-width="1"/>

      <text x="160" y="78" fill="#65727d" font-size="10" font-family="SFMono-Regular, Consolas, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">LEARNER · 决策与验收</text>
      <text x="480" y="78" fill="#276d89" font-size="10" font-family="SFMono-Regular, Consolas, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">PI MAIN SESSION · 实施</text>
      <text x="800" y="78" fill="#65727d" font-size="10" font-family="SFMono-Regular, Consolas, monospace" font-weight="600" text-anchor="middle" letter-spacing="0.12em">REVIEW SESSION · 只读</text>

      <!-- Connectors are drawn before nodes. -->
      <line x1="248" y1="144" x2="360" y2="144" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 480,180 V 204 Q 480,212 472,212 H 168 Q 160,212 160,220 V 240" fill="none" stroke="#65727d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="248" y1="276" x2="360" y2="276" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <line x1="600" y1="276" x2="712" y2="276" stroke="#65727d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 800,312 V 336 Q 800,344 792,344 H 488 Q 480,344 480,352 V 380" fill="none" stroke="#65727d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="360" y1="416" x2="248" y2="416" stroke="#4f90aa" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- Connector labels -->
      <rect x="278" y="130" width="52" height="16" rx="2" fill="#fbfaf6"/>
      <text x="304" y="142" fill="#276d89" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">HAND OFF</text>
      <rect x="278" y="198" width="76" height="16" rx="2" fill="#fbfaf6"/>
      <text x="316" y="210" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PLAN GATE</text>
      <rect x="278" y="262" width="64" height="16" rx="2" fill="#fbfaf6"/>
      <text x="310" y="274" fill="#276d89" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>
      <rect x="624" y="262" width="64" height="16" rx="2" fill="#fbfaf6"/>
      <text x="656" y="274" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">EVIDENCE</text>
      <rect x="612" y="330" width="72" height="16" rx="2" fill="#fbfaf6"/>
      <text x="648" y="342" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">FINDINGS</text>
      <rect x="278" y="402" width="56" height="16" rx="2" fill="#fbfaf6"/>
      <text x="306" y="414" fill="#276d89" font-size="8" font-family="SFMono-Regular, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">VERIFY</text>

      <!-- Learner nodes -->
      <rect x="72" y="108" width="176" height="72" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/>
      <text x="160" y="138" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">需求与边界</text>
      <text x="160" y="160" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">允许路径 · 禁止动作</text>

      <rect x="72" y="240" width="176" height="72" rx="6" fill="rgba(79,144,170,0.10)" stroke="#4f90aa" stroke-width="1.2"/>
      <text x="160" y="270" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">人工批准计划</text>
      <text x="160" y="292" fill="#276d89" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">先核范围，再允许修改</text>

      <rect x="72" y="380" width="176" height="72" rx="6" fill="rgba(79,144,170,0.10)" stroke="#4f90aa" stroke-width="1.2"/>
      <text x="160" y="410" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">最终人工验收</text>
      <text x="160" y="432" fill="#276d89" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">文件 · 命令 · 页面</text>

      <!-- Main Session nodes -->
      <rect x="360" y="108" width="240" height="72" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/>
      <text x="480" y="138" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">查项目，写检查点</text>
      <text x="480" y="160" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">命名 Session · 只做计划</text>

      <rect x="360" y="240" width="240" height="72" rx="6" fill="rgba(79,144,170,0.10)" stroke="#4f90aa" stroke-width="1.2"/>
      <text x="480" y="270" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">修改并运行测试</text>
      <text x="480" y="292" fill="#276d89" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">真实文件 · 真实命令结果</text>

      <rect x="360" y="380" width="240" height="72" rx="6" fill="#ffffff" stroke="#26313a" stroke-width="1"/>
      <text x="480" y="410" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">处理发现，更新检查点</text>
      <text x="480" y="432" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">只做必要修正 · 保留未知</text>

      <!-- Review node -->
      <rect x="712" y="240" width="176" height="72" rx="6" fill="rgba(38,49,58,0.04)" stroke="#65727d" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="800" y="270" fill="#26313a" font-size="16" font-weight="600" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">独立只读审阅</text>
      <text x="800" y="292" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif" text-anchor="middle">新 Session · Review Skill</text>

      <!-- Legend -->
      <line x1="40" y1="512" x2="920" y2="512" stroke="rgba(38,49,58,0.12)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#65727d" font-size="8" font-family="SFMono-Regular, Consolas, monospace" letter-spacing="0.14em">CONTROL RULES</text>
      <text x="176" y="540" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif">主 Session 不能批准自己</text>
      <text x="408" y="540" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif">审阅 Session 不能修改文件</text>
      <text x="664" y="540" fill="#65727d" font-size="12" font-family="PingFang SC, Microsoft YaHei, sans-serif">最终通过由人判断</text>
      <text x="920" y="580" fill="#65727d" font-size="12" font-family="Iowan Old Style, Songti SC, serif" font-style="italic" text-anchor="end">Agent 的完成报告只是线索，不是完成证明。</text>
    </svg>
