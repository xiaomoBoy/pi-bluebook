name: 实操步骤无法完成
description: 报告命令失效、结果不一致或缺少前置条件
title: "[实操] "
labels: [bug, documentation]
body:
  - type: input
    id: page
    attributes:
      label: 页面或章节
      description: 请填写页面链接或章节标题。
      placeholder: https://pi.xiaomovps.com/guide/...
    validations:
      required: true
  - type: textarea
    id: step
    attributes:
      label: 卡住的步骤
      description: 请说明执行到了哪一步、使用了什么命令或操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 按教程你原本应该看到什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 请粘贴必要的报错文字；上传截图前移除敏感信息。
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: 操作系统
      options:
        - macOS
        - Windows Git Bash
        - Linux
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Pi 与相关工具版本
      description: 如果问题与版本有关，请填写实际版本号。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已移除账号、API Key、私人路径和其他敏感信息。
          required: true
